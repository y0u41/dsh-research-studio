name: Bug report
description: Something is broken, misleading, or unsafe in a panel, a tool, or the docs.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Do not paste tokens, private paths, or unpublished research data.**
        Security issues: use the private advisory link instead of this form.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - PPT Master panel
        - Academic Research Skills panel
        - Host tool / runtime skill
        - Repository tests / CI
        - Documentation / licensing
        - Other
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: A clear, concrete description. Include the visible error text.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Install ...
        2. Open ...
        3. Fill ...
        4. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: dsh
    attributes:
      label: DSH version
      placeholder: e.g. desktop 0.x.y
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: e.g. 22.14.0
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: e.g. Windows 11 24H2
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Redact personal paths, tokens, and research data.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues.
          required: true
        - label: I removed secrets and private data from this report.
          required: true
        - label: This is not a security vulnerability (those go to the private advisory link).
          required: true
